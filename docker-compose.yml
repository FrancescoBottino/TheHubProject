services:
  db:
    image: postgres:15
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - db_dev_data:/var/lib/postgresql/data
    networks:
      - backend

  server:
    build:
      context: .
      dockerfile: deploy/server/Dockerfile
    container_name: server
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT}
      HOST: ${HOST}
    networks:
      - backend

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FE_PORT}:80"
    depends_on:
      - db
      - server
    networks:
      - backend

volumes:
  db_dev_data:

networks:
  backend: