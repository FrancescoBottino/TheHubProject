services:
  db:
    image: postgres:15
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  server:
    build:
      context: .
      dockerfile: deploy_development/server/Dockerfile
    container_name: server
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      PORT: ${PORT}
      HOST: ${HOST}
    volumes:
      - gradle_cache:/home/gradle/.gradle
      - konan_cache:/home/gradle/.konan
    networks:
      - backend

  frontend:
    build:
      context: .
      dockerfile: deploy_development/frontend/Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FE_PORT}:80"
    depends_on:
      - db
      - server
    volumes:
      - gradle_cache:/home/gradle/.gradle
      - konan_cache:/home/gradle/.konan
    networks:
      - backend

volumes:
  db_dev_data:
  gradle_cache:
  konan_cache:

networks:
  backend:
    driver: bridge