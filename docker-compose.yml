# docker-compose.yml
services:
  the_hub_project:
    image: postgres:15
    container_name: db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_dev_data:/var/lib/postgresql/data

volumes:
  db_dev_data: