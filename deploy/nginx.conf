server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Add this location block to serve the assetlinks.json file directly
    location /.well-known/assetlinks.json {
        add_header 'Content-Type' 'application/json';
        try_files $uri =404;
    }

    # Your existing SPA fallback rule
    location / {
        try_files $uri $uri/ /index.html;
    }
}