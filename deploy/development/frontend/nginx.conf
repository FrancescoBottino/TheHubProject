server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /.well-known/assetlinks.json {
        add_header 'Content-Type' 'application/json';
        try_files $uri =404;
    }
    location ~ \.wasm$ {
        add_header 'Content-Type' 'application/wasm';
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}